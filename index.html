 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>My College ID card </title>
</head>
<body>
    <div class="card-container">
        <div class="id-card">
        <header class="card-header">
            <img src="images/logo.jpeg" class="logo" alt="College Logo" >
            <h3>PRAGNYA DEGREE COLLEGE</h3>
            <p>Affiliated to Osmania University</p>
        </header>
<div class="photo-wrap">
    <img src="images/photo.jpeg" alt="Profile Photo" class="photo">
    </div>
    <main class="card-body">
        <div class="name-section">
            <h2 class="student-name">MEGHANA SIRIPURAM</h2>
            <P class="college">Pragnya Degree College</P>
            
        </div>
        <hr class="divider">
        <div class="details">
            <p><strong>Course:</strong>BCA</p>
            <p><strong>BirthDate</strong>04-10-2006</p>
        </div>
        <div class="id-line">
            <span class="id-label">ID No.:</span>
            <span class="id-value">124124861050</span>
        </div>
        <div class="barcode"></div>
    </main>
    <footer class="card-footer">
        <p class="footer-text">Issued by:Pragnya Degree College</p>
    </footer>
        </div>
    </div>

</body>
</html>
